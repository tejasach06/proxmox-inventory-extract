name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, vm101]
    steps:
      - uses: actions/checkout@v4
      - name: Test and build in podman
        run: |
          # The runner is itself a container talking to the host podman socket, so
          # bind-mounting $PWD would resolve on the host; copy files in and out instead.
          cid=$(podman create \
            -v cargo-registry:/usr/local/cargo/registry \
            -e CARGO_BUILD_JOBS=1 -w /src \
            rust:1-alpine sh -euc '
              apk add --no-cache musl-dev
              cargo test --locked
              cargo build --release --locked
            ')
          trap 'podman rm -f "$cid" >/dev/null' EXIT
          podman cp . "$cid":/src
          podman start -a "$cid"
          mkdir -p target/release
          podman cp "$cid":/src/target/release/proxmox-inventory-extract target/release/
      - name: Package
        run: |
          name=proxmox-inventory-extract-${{ github.ref_name }}-x86_64-linux
          mkdir "$name"
          cp target/release/proxmox-inventory-extract README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
      - name: Publish container image to ghcr.io
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/proxmox-inventory-extract"
          ctx=$(mktemp -d)
          cp Containerfile target/release/proxmox-inventory-extract "$ctx"/
          podman build -t "$image:${GITHUB_REF_NAME}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "$ctx"
          podman tag "$image:${GITHUB_REF_NAME}" "$image:latest"
          echo "$GH_TOKEN" | podman login ghcr.io -u "$GH_ACTOR" --password-stdin
          podman push "$image:${GITHUB_REF_NAME}"
          podman push "$image:latest"
          podman logout ghcr.io
