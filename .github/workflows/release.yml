name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, linux, vm101]
    steps:
      - uses: actions/checkout@v4
      - name: Test and build in podman
        run: |
          podman run --rm \
            -v "$PWD":/src:Z -w /src \
            -v cargo-registry:/usr/local/cargo/registry \
            rust:1-alpine sh -euc '
              apk add --no-cache musl-dev
              cargo test --locked
              cargo build --release --locked
            '
      - name: Package
        run: |
          name=proxmox-inventory-extract-${{ github.ref_name }}-x86_64-linux
          mkdir "$name"
          cp target/release/proxmox-inventory-extract README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
